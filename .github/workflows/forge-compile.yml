name: Forge Compile

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Provide Babel Core API compile stub
        shell: bash
        run: |
          # Babel Core is a private sibling repository and Magic Team intentionally
          # consumes its local development jar. GITHUB_TOKEN is repository-scoped,
          # so this compile-only job provides only the exact API surface Magic Team
          # imports. This does not replace Babel runtime/integration testing.
          mkdir -p src/main/java/com/gabri/babel/core/gameplay/entity
          cat > src/main/java/com/gabri/babel/core/gameplay/entity/BabelEntityRelations.java <<'EOF'
          package com.gabri.babel.core.gameplay.entity;

          import net.minecraft.world.entity.Entity;

          public final class BabelEntityRelations {
              public static final BabelEntityRelations INSTANCE = new BabelEntityRelations();

              private BabelEntityRelations() {
              }

              public Entity getRootOwner(Entity entity) {
                  return entity;
              }

              public boolean areAllies(Entity a, Entity b) {
                  return false;
              }
          }
          EOF

      - name: Clean Forge build
        run: ./gradlew clean build --stacktrace

      - name: Verify generated refmap
        shell: bash
        run: |
          mapfile -t REFMAPS < <(find build -type f -name '*refmap*.json' -print)
          if [ "${#REFMAPS[@]}" -eq 0 ]; then
            echo 'No Mixin refmap was generated.' >&2
            exit 1
          fi
          printf 'Generated refmap(s):\n'
          printf ' - %s\n' "${REFMAPS[@]}"
          for refmap in "${REFMAPS[@]}"; do
            echo "===== $refmap ====="
            cat "$refmap"
          done

      - name: Upload built jar and refmap
        uses: actions/upload-artifact@v4
        with:
          name: magic-team-forge-build
          if-no-files-found: error
          path: |
            build/libs/*.jar
            build/**/*refmap*.json
